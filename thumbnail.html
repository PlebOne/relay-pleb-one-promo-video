<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  :root { --bg: #05080a; --green: #22c55e; --green2: #4ade80; --red: #ef4444; --amber: #fbbf24; --fg: #e5e7eb; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); position: relative; font-family: "Space Grotesk", sans-serif; }
  canvas { position: absolute; inset: 0; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 38% 50%, transparent 20%, rgba(0,0,0,.9) 90%); }
  .ask { position: absolute; left: 60px; top: 40px; font-family: Anton, sans-serif; color: var(--green2); line-height: .9;
         text-transform: uppercase; text-shadow: 0 0 28px rgba(74,222,128,.55), 0 6px 0 #0a2a16; transform: rotate(-3deg); transform-origin: left top; }
  .ask .wait { font-size: 92px; color: #fff; text-shadow: 0 0 22px rgba(255,255,255,.35), 0 6px 0 #0a2a16; }
  .ask .big { font-size: 148px; display: block; }
  .bot { position: absolute; right: 70px; top: 120px; width: 380px; height: 380px; display: grid; place-items: center; }
  .bot .e { font-size: 250px; line-height: 1; filter: drop-shadow(0 0 30px rgba(239,68,68,.45)); }
  .bot .ring { position: absolute; inset: 0; border: 22px solid var(--red); border-radius: 50%; box-shadow: 0 0 40px rgba(239,68,68,.7), inset 0 0 40px rgba(239,68,68,.5); }
  .bot .slash { position: absolute; width: 22px; height: 100%; background: var(--red); transform: rotate(45deg); box-shadow: 0 0 30px rgba(239,68,68,.7); }
  .stamp { position: absolute; right: 64px; top: 470px; transform: rotate(8deg); font-family: Anton, sans-serif; font-size: 64px; letter-spacing: 3px;
           color: var(--red); border: 7px solid var(--red); padding: 0 22px; border-radius: 10px; background: rgba(5,8,10,.85); box-shadow: 0 0 30px rgba(239,68,68,.45); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; display: flex; align-items: center; gap: 22px; padding: 0 56px;
         background: linear-gradient(transparent, rgba(0,0,0,.9) 35%); }
  .logo { font-weight: 700; font-size: 66px; letter-spacing: -2px; color: var(--fg); text-shadow: 0 0 24px rgba(74,222,128,.5); }
  .logo .bolt { color: var(--amber); text-shadow: 0 0 22px rgba(251,191,36,.8); margin-right: 6px; }
  .tag { font-weight: 500; font-size: 30px; color: var(--green2); border-left: 4px solid var(--green); padding-left: 20px; line-height: 1.15; }
</style></head>
<body>
<canvas id="rain" width="1280" height="720"></canvas>
<div class="vig"></div>
<div class="ask"><span class="wait">Wait.</span><span class="big">Who<br>invited<br>you?</span></div>
<div class="bot"><div class="e">🤖</div><div class="ring"></div><div class="slash"></div></div>
<div class="stamp">DENIED</div>
<div class="bar"><div class="logo"><span class="bolt">⚡</span>relay.pleb.one</div><div class="tag">THE COMMUNITY<br>NOSTR RELAY</div></div>
<script>
  // Static matrix rain, seeded so the thumbnail is reproducible.
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const GLYPHS = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄ0123456789⚡NOSTR#$%&ﾅﾆﾇﾈﾉ";
  const g = document.getElementById("rain").getContext("2d");
  g.font = "20px monospace";
  for (let x = 0; x < 1280; x += 22) {
    const head = rnd() * 900, len = 8 + rnd() * 22;
    for (let i = 0; i < len; i++) {
      const y = head - i * 22; if (y < 0 || y > 720) continue;
      g.fillStyle = i === 0 ? "rgba(200,255,220,.35)" : `rgba(34,197,94,${.2 * (1 - i / len)})`;
      g.fillText(GLYPHS[Math.floor(rnd() * GLYPHS.length)], x, y);
    }
  }
</script>
</body></html>
